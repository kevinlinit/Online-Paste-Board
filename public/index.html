<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paste Board</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
      --border: #d9dde4; --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --err: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2;
        --border: #2e3440; --accent: #3b82f6; --ok: #4ade80; --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
    h1 { font-size: 20px; margin: 0; }
    .board { color: var(--muted); font-size: 14px; }
    .board input {
      font: inherit; width: 160px; padding: 2px 6px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--panel); color: var(--text);
    }
    textarea {
      flex: 1; min-height: 50vh; width: 100%; resize: vertical; padding: 14px;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    }
    textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    button {
      font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel); color: var(--text);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-left: auto; color: var(--muted); font-size: 13px; }
    #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    .hint { color: var(--muted); font-size: 13px; margin: 0; }
    kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Paste Board</h1>
    <label class="board">Board: <input id="board" spellcheck="false" maxlength="64" title="Letters, numbers, - and _"></label>
  </header>

  <textarea id="content" placeholder="Paste or type anything here, then click Save…" spellcheck="false"></textarea>

  <div class="bar">
    <button id="save" class="primary">Save</button>
    <button id="copy">Copy</button>
    <button id="reload">Reload</button>
    <button id="clear">Clear</button>
    <span id="status" role="status"></span>
  </div>
  <p class="hint">Open this same URL on another computer to see what you saved. <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>S</kbd> saves.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const content = $('content'), status = $('status'), boardInput = $('board');
  const VALID = /^[A-Za-z0-9_-]{1,64}$/;

  let board = decodeURIComponent(location.pathname.slice(1)) || 'default';
  let savedText = '';
  let updatedAt = null;

  boardInput.value = board;

  function setStatus(text, kind = '') {
    status.textContent = text;
    status.className = kind;
  }

  function describe(ts) {
    return ts ? 'Last saved ' + new Date(ts).toLocaleString() : 'Nothing saved yet';
  }

  const dirty = () => content.value !== savedText;

  async function load({ force = false } = {}) {
    try {
      const res = await fetch('/api/boards/' + encodeURIComponent(board), { cache: 'no-store' });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      const data = await res.json();
      if (data.updatedAt === updatedAt && !force) return;
      // Don't clobber unsaved local edits during background refreshes.
      if (dirty() && !force) {
        setStatus('Newer version on server — click Reload', 'err');
        return;
      }
      content.value = savedText = data.content;
      updatedAt = data.updatedAt;
      setStatus(describe(updatedAt));
    } catch (err) {
      setStatus('Load failed: ' + err.message, 'err');
    }
  }

  async function save() {
    $('save').disabled = true;
    setStatus('Saving…');
    try {
      const res = await fetch('/api/boards/' + encodeURIComponent(board), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content.value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      savedText = data.content;
      updatedAt = data.updatedAt;
      setStatus('Saved ✓ ' + new Date(updatedAt).toLocaleTimeString(), 'ok');
    } catch (err) {
      setStatus('Save failed: ' + err.message, 'err');
    } finally {
      $('save').disabled = false;
    }
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(content.value);
    } catch {
      // Fallback for plain-HTTP pages where the Clipboard API is unavailable.
      content.select();
      document.execCommand('copy');
    }
    setStatus('Copied to clipboard ✓', 'ok');
  }

  $('save').onclick = save;
  $('copy').onclick = copy;
  $('reload').onclick = () => load({ force: true });
  $('clear').onclick = () => { content.value = ''; content.focus(); setStatus('Cleared — click Save to store'); };

  content.addEventListener('input', () => { if (dirty()) setStatus('Unsaved changes'); });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });

  boardInput.addEventListener('change', () => {
    const name = boardInput.value.trim();
    if (!VALID.test(name)) { boardInput.value = board; setStatus('Board names: letters, numbers, - and _', 'err'); return; }
    if (dirty() && !confirm('Discard unsaved changes?')) { boardInput.value = board; return; }
    location.pathname = '/' + name;
  });

  window.addEventListener('beforeunload', (e) => { if (dirty()) e.preventDefault(); });

  load({ force: true });
  setInterval(() => { if (!document.hidden) load(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
